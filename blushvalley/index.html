<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blush Valley</title>
<meta name="description" content="Bibi와 세 명의 나, Combi · Buzzi · Honi가 일하는 픽셀 작업실">
<meta property="og:title" content="Blush Valley">
<meta property="og:description" content="Bibi와 세 명의 나가 일하는 픽셀 작업실">
<meta property="og:image" content="https://seonubae.github.io/blushvalley/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F3D9DF">
<style>
/* layout: one pixel studio, centered, filling the phone height */
:root{ --bg:#F3D9DF; --ink:#4A2E2A; color-scheme: light; }
html,body{height:100%}
body{background:var(--bg);margin:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;box-sizing:border-box}
.frame{height:min(100%, calc((100vw - 32px) * 448 / 256));aspect-ratio:256/448;max-width:100%;border:2px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>

<div class="frame"><canvas id="scene" width="256" height="448" role="img" aria-label="Blush Valley 픽셀 작업실. Bibi와 Combi, Buzzi, Honi가 일하고 걸어 다니는 모습"></canvas></div>

<script>
(function(){
  const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
  const kstHour=()=>{ try{ return +new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',hour12:false}).formatToParts(new Date()).find(x=>x.type==='hour').value; }catch(e){ return new Date().getHours(); } };
  const isNight=()=>{const h=kstHour(); return h>=19 || h<9;};
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};

  // sheet: rows down,left,right,up · cols 0-3 walk, 4 blink, 5 happy, 6 surprised
  const ROW={down:0,left:1,right:2,up:3};
  function draw(img,dir,col,x,y,clipY){
    if(!img) return;
    ctx.save();
    if(clipY!=null){ctx.beginPath();ctx.rect(0,0,256,clipY);ctx.clip();}
    ctx.drawImage(img,col*16,ROW[dir]*37,16,37,Math.round(x),Math.round(y),16,37);
    ctx.restore();
  }
  function shadow(x,y){ ctx.globalAlpha=.22; ctx.fillStyle='#3C1E1E'; ctx.beginPath(); ctx.ellipse(x+8,y+36,6,1.8,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  function honey(x,y){R(x,y+2,7,7,'#4A2E2A');R(x+1,y+3,5,5,'#F2BF6A');R(x+1,y,5,3,'#4A2E2A');R(x+2,y+1,3,1,'#F7C6D2');R(x+2,y+4,1,2,'#FFE7B0');}
  function bubble(x,y,col){R(x,y,11,8,'#4A2E2A');R(x+1,y+1,9,6,'#FFFFFF');R(x+4,y+2,3,3,col);R(x+4,y+8,2,2,'#4A2E2A');}
  function paper(x,y){R(x,y,8,10,'#4A2E2A');R(x+1,y+1,6,8,'#FFFFFF');R(x+2,y+3,4,1,'#C5D5E6');R(x+2,y+5,3,1,'#C5D5E6');}
  function check(x,y){R(x,y,11,8,'#4A2E2A');R(x+1,y+1,9,6,'#FFFFFF');[[3,4],[4,5],[5,4],[6,3],[7,2]].forEach(([a,b])=>R(x+a,y+b,1,1,'#3E9B63'));}
  function coffee(x,y){R(x,y,6,6,'#4A2E2A');R(x+1,y+1,4,4,'#FFFFFF');R(x+1,y+1,4,1,'#8F6447');R(x+6,y+2,1,2,'#4A2E2A');}

  // ---- actor: walks a looping script of steps
  function Actor(name,x,y,dir,script){ return {name,x,y,dir,script,i:0,wait:0,walk:0,emote:null,carry:null,clip:null}; }
  const SPEED=16;
  function step(a,dt,now){
    if(reduce){ return; }
    const s=a.script[a.i];
    if(!s){ a.i=0; return; }
    if(s.to){
      const [tx,ty]=s.to, dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
      if(d<0.6){ a.x=tx; a.y=ty; a.i=(a.i+1)%a.script.length; a.walk=0; return; }
      const v=Math.min(d,SPEED*dt); a.x+=dx/d*v; a.y+=dy/d*v; a.walk+=dt;
      a.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'up':'down');
      a.emote=null;
    } else if(s.wait!=null){
      if(a.wait<=0){ a.wait=s.wait; if(s.face) a.dir=s.face; a.emote=s.emote||null; a.carry=s.carry!==undefined?s.carry:a.carry; if(s.fx) a.fx=s.fx; else a.fx=null; a.fxT=0; }
      a.wait-=dt; a.fxT=(a.fxT||0)+dt;
      if(a.wait<=0){ a.i=(a.i+1)%a.script.length; a.emote=null; a.fx=null; }
    }
  }
  const blinkAt={};
  function col(a,now){
    const s=a.script[a.i];
    if(s && s.to && !reduce) return Math.floor(a.walk*8)%4;
    if(a.emote==='happy') return 5;
    if(a.emote==='surprised') return 6;
    if(!blinkAt[a.name]) blinkAt[a.name]=now+1500+Math.random()*2500;
    if(now>blinkAt[a.name] && now<blinkAt[a.name]+140 && a.dir!=='up') return 4;
    if(now>blinkAt[a.name]+140) blinkAt[a.name]=now+2400+Math.random()*3000;
    return 0;
  }

  // waypoints (top-left of a 16x37 frame)
  const DESK_B=[106,226], CORR=[106,176], DOOR=[194,176], INSIDE=[194,150];
  function makeActors(N){
    const A={};
    A.combi=Actor('combi',46,226,'down',[
      {wait:3.2,face:'down',fx:'type'},{wait:2.2,face:'down',emote:'happy',fx:'honey'},{wait:4,face:'down',fx:'type'}]);
    A.buzzi=Actor('buzzi',DESK_B[0],DESK_B[1],'down', N ? [
      {wait:3,face:'down',fx:'type'},{wait:2.4,face:'down',emote:'surprised',fx:'reject'},{wait:2,face:'down',fx:'type'},
      {to:CORR},{to:DOOR},{to:INSIDE},{wait:2.6,face:'up',carry:'paper',fx:'hand'},{to:DOOR,carry:null},{to:CORR},{to:DESK_B},{wait:1,face:'down'}
    ] : [
      {wait:3,face:'down',fx:'type'},{wait:2.4,face:'down',emote:'surprised',fx:'reject'},{wait:4,face:'down',fx:'type'}
    ]);
    A.honi=Actor('honi',214,279,'down', N ? [
      {wait:2,face:'down'},{to:[230,279]},{wait:1.4,face:'left',emote:'happy'},{to:[206,279]},{wait:1.6,face:'down'}
    ] : [
      {wait:1.8,face:'down',emote:'happy'},{to:[230,279]},{wait:1.2,face:'left'},{to:[206,279]},
      {to:[206,330]},{to:[194,328]},{wait:2.6,face:'up',fx:'coffee'},{to:[206,330]},{to:[206,279]},{wait:1.2,face:'down'}
    ]);
    A.bibi = N ? Actor('bibi',200,83,'down',[{wait:3,face:'down'},{wait:2.6,face:'down',fx:'approve'},{wait:3,face:'down'}])
               : Actor('bibi',67,146,'down',[
      {wait:2.4,face:'down'},{to:[98,146]},{wait:3,face:'up',fx:'solder'},{to:[70,146]},{wait:2,face:'left',emote:'happy'},{wait:1,face:'down'}]);
    return A;
  }

  Promise.all(['bg-day.png','bg-night.png','sheet-bibi.png','sheet-combi.png','sheet-buzzi.png','sheet-honi.png'].map(load)).then(([day,night,bibi,combi,buzzi,honi])=>{
    const SH={bibi,combi,buzzi,honi};
    let N=isNight(), A=makeActors(N), last=performance.now(), lastCheck=performance.now();
    function frame(now){
      const dt=Math.min(.1,(now-last)/1000); last=now; const t=now/1000;
      if(now-lastCheck>20000){ lastCheck=now; const n=isNight(); if(n!==N){ N=n; A=makeActors(N); } }
      const bg=N?night:day; if(bg) ctx.drawImage(bg,0,0); else R(0,0,256,448,'#F3D9DF');
      // ambient
      if(!N){ const on=Math.floor(t*1.5)%2===0; const c=on?'#FF9EC0':'#F7A8C0'; R(43,104,2,3,c);R(48,104,2,3,c); }
      else if(!reduce){ const zy=Math.floor((t*6)%10); ctx.globalAlpha=1-zy/10; R(58,96-zy,3,1,'#E6DDF5');R(59,97-zy,1,1,'#E6DDF5');R(58,98-zy,3,1,'#E6DDF5'); ctx.globalAlpha=1; }
      R(68,242,14,14,'#1E2630');
      for(let i=0;i<5;i++){ const yy=243+((i*3+Math.floor(t*(reduce?0:4)))%12); const L=3+((i*5)%8); R(69,yy,L,1,i%2?'#9FE0B4':'#9DB8DA'); }
      Object.values(A).forEach(a=>step(a,dt,now));
      // draw in depth order (feet y)
      const list=Object.values(A).sort((p,q)=>(p.y+37)-(q.y+37));
      for(const a of list){
        const atDesk=(a.name==='combi') || (a.name==='buzzi' && a.y>=224 && a.x<150);
        const atBibiDesk=(a.name==='bibi' && N);
        const clip= atDesk ? 262 : atBibiDesk ? 112 : null;
        const typingBob = a.fx==='type' && !reduce && Math.floor(t*6)%2===0 ? 1 : 0;
        const walking = a.script[a.i] && a.script[a.i].to && !reduce;
        if(!atDesk && !atBibiDesk) shadow(a.x,a.y);
        draw(SH[a.name], a.dir, col(a,now), a.x, a.y + typingBob, clip);
        // effects
        if(a.fx==='honey') honey(a.x+4, a.y-12-Math.round(Math.min(1,(a.fxT||0)*2)*3));
        if(a.fx==='reject') bubble(a.x+12, a.y-12, '#D9534F');
        if(a.fx==='hand' && (a.fxT||0)<2) paper(a.x+4, a.y-12);
        if(a.fx==='coffee') coffee(a.x+5, a.y-9);
        if(a.fx==='solder' && Math.floor(t*8)%2===0) R(a.x+8, a.y-2, 1, 1, '#FFE08A');
        if(a.fx==='approve') check(a.x+3, a.y-13);
        if(a.carry==='paper' && walking) paper(a.x+12, a.y+16);
      }
      // night: Bibi reacts when Buzzi brings a paper
      if(N && A.buzzi.fx==='hand'){ draw(SH.bibi,'down',5,A.bibi.x,A.bibi.y,112); check(A.bibi.x+3,A.bibi.y-13); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
